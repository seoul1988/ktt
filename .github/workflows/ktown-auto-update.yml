name: KTown Triangle Auto Update

on:
  schedule:
    # 매시간 정각 실행, UTC 기준
    - cron: "0 * * * *"

  # GitHub Actions 화면에서 수동 실행
  workflow_dispatch:

concurrency:
  group: ktown-triangle-auto-update
  cancel-in-progress: false

jobs:
  todays-korea:
    name: Update Today's Korea
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Call Today's Korea API
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Updating Today's Korea..."

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --location \
            --connect-timeout 30 \
            --max-time 300 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: KTownTriangle-GitHub-Actions/1.0" \
            "https://www.ktowntriangle.com/api/todays-korea/update"

          echo ""
          echo "Today's Korea update completed."

  instagram:
    name: Update Instagram
    runs-on: ubuntu-latest
    timeout-minutes: 35

    # 수동 실행 또는 UTC 0, 4, 8, 12, 16, 20시만 실행
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        github.event.schedule == '0 * * * *'
      }}

    steps:
      - name: Set current UTC hour
        id: time
        shell: bash
        run: |
          UTC_HOUR=$(date -u +%-H)

          echo "hour=$UTC_HOUR" >> "$GITHUB_OUTPUT"
          echo "Current UTC hour: $UTC_HOUR"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ $((UTC_HOUR % 4)) -eq 0 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout project
        if: steps.time.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.time.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install project dependencies
        if: steps.time.outputs.should_run == 'true'
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.time.outputs.should_run == 'true'
        run: npx playwright install --with-deps chromium

      - name: Check Instagram login file
        if: steps.time.outputs.should_run == 'true'
        shell: bash
        run: |
          if [ ! -f "playwright/.auth/instagram.json" ]; then
            echo "::error::playwright/.auth/instagram.json 파일이 없습니다."
            echo "::error::Instagram 로그인 상태 파일을 GitHub Actions에서 사용할 수 있도록 준비해야 합니다."
            exit 1
          fi

          echo "Instagram login file found."

      - name: Start Next.js server
        if: steps.time.outputs.should_run == 'true'
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

          # 기존 API가 INSTAGRAM_SYNC_SECRET을 확인하므로
          # CRON_SECRET과 같은 값을 사용합니다.
          INSTAGRAM_SYNC_SECRET: ${{ secrets.CRON_SECRET }}

          NODE_ENV: development
        run: |
          npm run dev -- --hostname 127.0.0.1 > next-server.log 2>&1 &

          echo $! > next-server.pid
          echo "Waiting for Next.js server..."

          for i in {1..60}; do
            if curl --silent --output /dev/null \
              "http://127.0.0.1:3000"; then
              echo "Next.js server is ready."
              exit 0
            fi

            sleep 2
          done

          echo "::error::Next.js server did not start."
          cat next-server.log
          exit 1

      - name: Run Instagram sync locally
        if: steps.time.outputs.should_run == 'true'
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Running Instagram Playwright sync on GitHub Actions..."

          RESPONSE_FILE=$(mktemp)

          set +e

          HTTP_STATUS=$(curl \
            --show-error \
            --silent \
            --location \
            --connect-timeout 30 \
            --max-time 1800 \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: KTownTriangle-GitHub-Actions/1.0" \
            "http://127.0.0.1:3000/api/instagram-sync?limit=44")

          CURL_EXIT=$?

          set -e

          echo ""
          echo "Curl exit code: $CURL_EXIT"
          echo "HTTP status: $HTTP_STATUS"
          echo ""
          echo "API response:"
          cat "$RESPONSE_FILE"
          echo ""

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::Instagram curl failed with exit code $CURL_EXIT"

            echo ""
            echo "Next.js server log:"
            cat next-server.log

            exit 1
          fi

          if [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Instagram API returned HTTP $HTTP_STATUS"

            echo ""
            echo "Next.js server log:"
            cat next-server.log

            exit 1
          fi

          echo "Instagram update completed successfully."

      - name: Show Next.js log after failure
        if: failure() && steps.time.outputs.should_run == 'true'
        shell: bash
        run: |
          echo "========== Next.js server log =========="

          if [ -f "next-server.log" ]; then
            cat next-server.log
          else
            echo "next-server.log was not created."
          fi

      - name: Instagram skipped
        if: steps.time.outputs.should_run != 'true'
        run: |
          echo "Instagram is scheduled only at UTC 0, 4, 8, 12, 16 and 20."

  google-ratings:
    name: Update Google Ratings
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Set current UTC hour
        id: time
        shell: bash
        run: |
          UTC_HOUR=$(date -u +%-H)

          echo "hour=$UTC_HOUR" >> "$GITHUB_OUTPUT"
          echo "Current UTC hour: $UTC_HOUR"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          elif [ "$UTC_HOUR" = "0" ] || [ "$UTC_HOUR" = "12" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Call Google Ratings API
        if: steps.time.outputs.should_run == 'true'
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          echo "Updating Google ratings..."

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --location \
            --connect-timeout 30 \
            --max-time 900 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: KTownTriangle-GitHub-Actions/1.0" \
            "https://www.ktowntriangle.com/api/update-google-ratings"

          echo ""
          echo "Google ratings update completed."

      - name: Google Ratings skipped
        if: steps.time.outputs.should_run != 'true'
        run: |
          echo "Google Ratings runs only at UTC 0 and 12."