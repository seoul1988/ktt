name: KTown Triangle Auto Update

on:
  schedule:
    # 매시간 정각 실행, UTC 기준
    - cron: "0 * * * *"

  # GitHub Actions 화면에서 수동 실행
  workflow_dispatch:

concurrency:
  group: ktown-triangle-auto-update
  cancel-in-progress: false

jobs:
  todays-korea:
    name: Update Today's Korea
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Call Today's Korea API
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET GitHub Secret이 비어 있습니다."
            exit 1
          fi

          echo "Updating Today's Korea..."

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --location \
            --connect-timeout 30 \
            --max-time 300 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: KTownTriangle-GitHub-Actions/1.0" \
            "https://www.ktowntriangle.com/api/todays-korea/update"

          echo ""
          echo "Today's Korea update completed."

  instagram:
    name: Update Instagram
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check Instagram schedule
        id: instagram-time
        shell: bash
        run: |
          UTC_HOUR=$(date -u +%-H)

          echo "hour=$UTC_HOUR" >> "$GITHUB_OUTPUT"
          echo "Current UTC hour: $UTC_HOUR"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: Instagram sync will run."
          elif [ $((UTC_HOUR % 4)) -eq 0 ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled Instagram sync will run."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Instagram sync will be skipped this hour."
          fi

      - name: Checkout project
        if: steps.instagram-time.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Set up Node.js
        if: steps.instagram-time.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Show Node and npm versions
        if: steps.instagram-time.outputs.should_run == 'true'
        shell: bash
        run: |
          node --version
          npm --version

      - name: Install project dependencies
        if: steps.instagram-time.outputs.should_run == 'true'
        shell: bash
        run: |
          npm install --no-audit --no-fund

      - name: Install Playwright Chromium
        if: steps.instagram-time.outputs.should_run == 'true'
        shell: bash
        run: |
          npx playwright install --with-deps chromium

      - name: Create Instagram login file
        if: steps.instagram-time.outputs.should_run == 'true'
        shell: bash
        env:
          INSTAGRAM_STORAGE_STATE: ${{ secrets.INSTAGRAM_STORAGE_STATE }}
        run: |
          set -e

          if [ -z "$INSTAGRAM_STORAGE_STATE" ]; then
            echo "::error::INSTAGRAM_STORAGE_STATE GitHub Secret이 비어 있습니다."
            exit 1
          fi

          mkdir -p playwright/.auth

          printf '%s' "$INSTAGRAM_STORAGE_STATE" \
            > playwright/.auth/instagram.json

          if [ ! -s "playwright/.auth/instagram.json" ]; then
            echo "::error::Instagram 로그인 파일 생성에 실패했습니다."
            exit 1
          fi

          node <<'NODE'
          const fs = require("fs");

          const file = "playwright/.auth/instagram.json";

          try {
            const state = JSON.parse(
              fs.readFileSync(file, "utf8"),
            );

            if (!Array.isArray(state.cookies)) {
              throw new Error("cookies 배열이 없습니다.");
            }

            if (state.cookies.length === 0) {
              throw new Error(
                "저장된 Instagram 로그인 쿠키가 없습니다.",
              );
            }

            const instagramCookies = state.cookies.filter(
              (cookie) =>
                typeof cookie.domain === "string" &&
                cookie.domain.includes("instagram.com"),
            );

            if (instagramCookies.length === 0) {
              throw new Error(
                "Instagram 도메인의 로그인 쿠키가 없습니다.",
              );
            }

            console.log(
              "Instagram login file created.",
            );

            console.log(
              "Total cookies:",
              state.cookies.length,
            );

            console.log(
              "Instagram cookies:",
              instagramCookies.length,
            );
          } catch (error) {
            console.error(
              "Invalid Instagram storage state:",
              error instanceof Error
                ? error.message
                : String(error),
            );

            process.exit(1);
          }
          NODE

      - name: Validate required GitHub Secrets
        if: steps.instagram-time.outputs.should_run == 'true'
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e

          if [ -z "$SUPABASE_URL" ]; then
            echo "::error::SUPABASE_URL GitHub Secret이 비어 있습니다."
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_ANON_KEY GitHub Secret이 비어 있습니다."
            exit 1
          fi

          if [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::SUPABASE_SERVICE_ROLE_KEY GitHub Secret이 비어 있습니다."
            exit 1
          fi

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET GitHub Secret이 비어 있습니다."
            exit 1
          fi

          echo "All required GitHub Secrets are available."

      - name: Start Next.js server
        if: steps.instagram-time.outputs.should_run == 'true'
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          NEXT_TELEMETRY_DISABLED: "1"
          NODE_ENV: development
        run: |
          set -e

          echo "Starting local Next.js server..."

          npm run dev -- --hostname 127.0.0.1 \
            > next-server.log 2>&1 &

          NEXT_SERVER_PID=$!

          echo "$NEXT_SERVER_PID" > next-server.pid
          echo "Next.js PID: $NEXT_SERVER_PID"
          echo "Waiting for Next.js server..."

          for i in {1..90}; do
            if ! kill -0 "$NEXT_SERVER_PID" 2>/dev/null; then
              echo "::error::Next.js server stopped unexpectedly."

              if [ -f "next-server.log" ]; then
                cat next-server.log
              fi

              exit 1
            fi

            HTTP_STATUS=$(curl \
              --silent \
              --output /dev/null \
              --write-out "%{http_code}" \
              --connect-timeout 5 \
              "http://127.0.0.1:3000/api/instagram-sync?limit=1" \
              || true)

            if [ "$HTTP_STATUS" != "000" ]; then
              echo "Next.js server is ready."
              echo "Instagram API probe status: $HTTP_STATUS"
              exit 0
            fi

            echo "Waiting... attempt $i/90"
            sleep 2
          done

          echo "::error::Next.js server did not become ready."

          if [ -f "next-server.log" ]; then
            cat next-server.log
          fi

          exit 1

      - name: Run Instagram sync locally
        if: steps.instagram-time.outputs.should_run == 'true'
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e

          echo "Running Instagram Playwright sync on GitHub Actions..."

          RESPONSE_FILE=$(mktemp)

          set +e

          HTTP_STATUS=$(curl \
            --show-error \
            --silent \
            --location \
            --connect-timeout 30 \
            --max-time 2400 \
            --output "$RESPONSE_FILE" \
            --write-out "%{http_code}" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: KTownTriangle-GitHub-Actions/1.0" \
            "http://127.0.0.1:3000/api/instagram-sync?limit=44")

          CURL_EXIT=$?

          set -e

          echo ""
          echo "Curl exit code: $CURL_EXIT"
          echo "HTTP status: $HTTP_STATUS"
          echo ""
          echo "API response:"

          if [ -s "$RESPONSE_FILE" ]; then
            cat "$RESPONSE_FILE"
          else
            echo "(empty response)"
          fi

          echo ""

          if [ "$CURL_EXIT" -ne 0 ]; then
            echo "::error::Instagram curl failed with exit code $CURL_EXIT"

            if [ -f "next-server.log" ]; then
              echo ""
              echo "Next.js server log:"
              cat next-server.log
            fi

            exit 1
          fi

          if [ "$HTTP_STATUS" -lt 200 ] || \
             [ "$HTTP_STATUS" -ge 300 ]; then
            echo "::error::Instagram API returned HTTP $HTTP_STATUS"

            if [ -f "next-server.log" ]; then
              echo ""
              echo "Next.js server log:"
              cat next-server.log
            fi

            exit 1
          fi

          echo "Instagram update completed successfully."

      - name: Show Next.js log after failure
        if: failure() && steps.instagram-time.outputs.should_run == 'true'
        shell: bash
        run: |
          echo "========== Next.js server log =========="

          if [ -f "next-server.log" ]; then
            cat next-server.log
          else
            echo "next-server.log was not created."
          fi

      - name: Stop Next.js server
        if: always() && steps.instagram-time.outputs.should_run == 'true'
        shell: bash
        run: |
          if [ -f "next-server.pid" ]; then
            NEXT_SERVER_PID=$(cat next-server.pid)

            if kill -0 "$NEXT_SERVER_PID" 2>/dev/null; then
              echo "Stopping Next.js server PID $NEXT_SERVER_PID..."
              kill "$NEXT_SERVER_PID" || true
            fi
          fi

      - name: Instagram skipped
        if: steps.instagram-time.outputs.should_run != 'true'
        shell: bash
        run: |
          echo "Instagram runs automatically only at:"
          echo "UTC 0, 4, 8, 12, 16 and 20."
          echo "Manual workflow runs always execute Instagram."

  google-ratings:
    name: Update Google Ratings
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check Google Ratings schedule
        id: ratings-time
        shell: bash
        run: |
          UTC_HOUR=$(date -u +%-H)

          echo "hour=$UTC_HOUR" >> "$GITHUB_OUTPUT"
          echo "Current UTC hour: $UTC_HOUR"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: Google Ratings update will run."
          elif [ "$UTC_HOUR" = "0" ] || \
               [ "$UTC_HOUR" = "12" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled Google Ratings update will run."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Google Ratings update will be skipped this hour."
          fi

      - name: Call Google Ratings API
        if: steps.ratings-time.outputs.should_run == 'true'
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET GitHub Secret이 비어 있습니다."
            exit 1
          fi

          echo "Updating Google ratings..."

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --location \
            --connect-timeout 30 \
            --max-time 900 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: KTownTriangle-GitHub-Actions/1.0" \
            "https://www.ktowntriangle.com/api/update-google-ratings"

          echo ""
          echo "Google ratings update completed."

      - name: Google Ratings skipped
        if: steps.ratings-time.outputs.should_run != 'true'
        shell: bash
        run: |
          echo "Google Ratings runs automatically only at UTC 0 and 12."
          echo "Manual workflow runs always execute Google Ratings."