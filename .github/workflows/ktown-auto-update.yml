name: KTown Triangle Auto Update

on:
  schedule:
    # 30분마다 워크플로를 실행합니다.
    # 뉴스는 매번 실행하고, 다른 작업은 내부에서 미국 동부시간을 확인합니다.
    - cron: "*/30 * * * *"

  # GitHub Actions 화면에서 수동 실행할 수 있습니다.
  workflow_dispatch:

concurrency:
  group: ktown-triangle-auto-update
  cancel-in-progress: false

jobs:
  # =========================================================
  # 한국·미국 뉴스
  # 매 30분마다 실행
  # =========================================================
  community-news:
    name: Update Korea and US News
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Call Community News API
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET GitHub Secret이 비어 있습니다."
            exit 1
          fi

          echo "Updating Korea and US news..."

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --location \
            --connect-timeout 30 \
            --max-time 300 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: KTownTriangle-GitHub-Actions/1.0" \
            "https://www.ktowntriangle.com/api/cron/sync-community-news"

          echo ""
          echo "Korea and US news update completed."

  # =========================================================
  # Today's Korea 연예인 뉴스
  # 미국 동부시간 오전 10시, 오후 3시, 6시, 7시 정각
  # =========================================================
  todays-korea:
    name: Update Celebrity News
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check celebrity update schedule
        id: celebrity-time
        shell: bash
        run: |
          ET_HOUR=$(TZ=America/New_York date +%-H)
          ET_MINUTE=$(TZ=America/New_York date +%-M)

          echo "hour=$ET_HOUR" >> "$GITHUB_OUTPUT"
          echo "minute=$ET_MINUTE" >> "$GITHUB_OUTPUT"

          echo "Current Eastern Time: ${ET_HOUR}:${ET_MINUTE}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: Celebrity update will run."

          elif [ "$ET_MINUTE" = "0" ] && \
               { [ "$ET_HOUR" = "10" ] || \
                 [ "$ET_HOUR" = "15" ] || \
                 [ "$ET_HOUR" = "18" ] || \
                 [ "$ET_HOUR" = "19" ]; }; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled celebrity update will run."

          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Celebrity update will be skipped."
          fi

      - name: Call Today's Korea API
        if: steps.celebrity-time.outputs.should_run == 'true'
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET GitHub Secret이 비어 있습니다."
            exit 1
          fi

          echo "Updating celebrity news..."

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --location \
            --connect-timeout 30 \
            --max-time 300 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: KTownTriangle-GitHub-Actions/1.0" \
            "https://www.ktowntriangle.com/api/todays-korea/update"

          echo ""
          echo "Celebrity update completed."

      - name: Celebrity update skipped
        if: steps.celebrity-time.outputs.should_run != 'true'
        shell: bash
        run: |
          echo "Celebrity updates run at Eastern Time:"
          echo "10:00 AM"
          echo "3:00 PM"
          echo "6:00 PM"
          echo "7:00 PM"

  # =========================================================
  # Google Ratings
  # 미국 동부시간 매일 오전 1시 정각
  # =========================================================
  google-ratings:
    name: Update Google Ratings
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check Google Ratings schedule
        id: ratings-time
        shell: bash
        run: |
          ET_HOUR=$(TZ=America/New_York date +%-H)
          ET_MINUTE=$(TZ=America/New_York date +%-M)

          echo "hour=$ET_HOUR" >> "$GITHUB_OUTPUT"
          echo "minute=$ET_MINUTE" >> "$GITHUB_OUTPUT"

          echo "Current Eastern Time: ${ET_HOUR}:${ET_MINUTE}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: Google Ratings update will run."

          elif [ "$ET_HOUR" = "1" ] && [ "$ET_MINUTE" = "0" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled Google Ratings update will run."

          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Google Ratings update will be skipped."
          fi

      - name: Call Google Ratings API
        if: steps.ratings-time.outputs.should_run == 'true'
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET GitHub Secret이 비어 있습니다."
            exit 1
          fi

          echo "Updating Google ratings..."

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --location \
            --connect-timeout 30 \
            --max-time 900 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: KTownTriangle-GitHub-Actions/1.0" \
            "https://www.ktowntriangle.com/api/update-google-ratings"

          echo ""
          echo "Google ratings update completed."

      - name: Google Ratings skipped
        if: steps.ratings-time.outputs.should_run != 'true'
        shell: bash
        run: |
          echo "Google Ratings runs once daily at 1:00 AM Eastern Time."

