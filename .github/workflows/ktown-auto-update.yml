name: KTown Triangle Auto Update

on:
  schedule:
    # 매시간 7분에 실행 (UTC 기준 cron)
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================
  # RSS 한국·미국 뉴스
  # GitHub Runner가 직접 처리 -> Vercel API 호출 없음
  # =========================================================
  community-news:
    name: Update Korea and US News
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Community News Sync Directly
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx --yes tsx scripts/sync-community-news.ts

  # =========================================================
  # Today's Korea
  # GitHub Runner가 직접 처리 -> Vercel API 호출 없음
  # =========================================================
  todays-korea:
    name: Update Celebrity News
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Today's Korea Directly
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx --yes tsx scripts/update-todays-korea.ts

  # =========================================================
  # Google Ratings
  # 하루 1회만 실행. 현재 API 방식 유지.
  # =========================================================
  google-ratings:
    name: Update Google Ratings
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Check Google Ratings schedule
        id: ratings-time
        shell: bash
        run: |
          set -euo pipefail

          EVENT_NAME="${{ github.event_name }}"
          ET_HOUR=$(TZ=America/New_York date +%-H)

          echo "Event: ${EVENT_NAME}"
          echo "Eastern hour: ${ET_HOUR}"

          if [ "$EVENT_NAME" = "schedule" ] && [ "$ET_HOUR" = "0" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Google Ratings will run."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Google Ratings will be skipped."
          fi

      - name: Call Google Ratings API
        if: steps.ratings-time.outputs.should_run == 'true'
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET GitHub Secret이 비어 있습니다."
            exit 1
          fi

          curl \
            --fail-with-body \
            --show-error \
            --location \
            --connect-timeout 20 \
            --max-time 300 \
            --retry 1 \
            --retry-delay 10 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: KTownTriangle-GitHub-Actions/1.0" \
            "https://www.ktowntriangle.com/api/update-google-ratings"

      - name: Google Ratings skipped
        if: steps.ratings-time.outputs.should_run != 'true'
        run: echo "Google Ratings was skipped."


