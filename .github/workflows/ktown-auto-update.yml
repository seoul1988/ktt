name: KTown Triangle Auto Update

on:
  schedule:
    # 매시간 7분에 실행합니다.
    # GitHub Actions의 정각 혼잡과 실행 지연을 줄이기 위해 7분으로 설정
    - cron: "7 * * * *"

  # GitHub Actions 화면에서 수동 실행
  workflow_dispatch:

concurrency:
  group: ktown-triangle-auto-update
  cancel-in-progress: false

jobs:
  # =========================================================
  # 한국·미국 뉴스
  # 매시간 실행
  # =========================================================
  community-news:
    name: Update Korea and US News
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Call Community News API
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET GitHub Secret이 비어 있습니다."
            exit 1
          fi

          echo "Updating Korea and US news..."

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --location \
            --connect-timeout 30 \
            --max-time 300 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: KTownTriangle-GitHub-Actions/1.0" \
            "https://www.ktowntriangle.com/api/cron/sync-community-news"

          echo ""
          echo "Korea and US news update completed."

  # =========================================================
  # Today's Korea 연예인 뉴스
  # 매시간 실행
  # =========================================================
  todays-korea:
    name: Update Celebrity News
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Call Today's Korea API
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET GitHub Secret이 비어 있습니다."
            exit 1
          fi

          echo "Updating celebrity news..."

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --location \
            --connect-timeout 30 \
            --max-time 300 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: KTownTriangle-GitHub-Actions/1.0" \
            "https://www.ktowntriangle.com/api/todays-korea/update"

          echo ""
          echo "Celebrity update completed."

  # =========================================================
  # Google Ratings
  # 미국 동부시간 매일 밤 12시대에 한 번만 실행
  # =========================================================
  google-ratings:
    name: Update Google Ratings
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check Google Ratings schedule
        id: ratings-time
        shell: bash
        run: |
          ET_DATE=$(TZ=America/New_York date +%Y-%m-%d)
          ET_HOUR=$(TZ=America/New_York date +%-H)
          ET_MINUTE=$(TZ=America/New_York date +%-M)

          echo "Eastern date: ${ET_DATE}"
          echo "Current Eastern Time: ${ET_HOUR}:${ET_MINUTE}"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: Google Ratings update will run."

          elif [ "$ET_HOUR" = "0" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Midnight Eastern Time: Google Ratings update will run."

          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Google Ratings update will be skipped."
          fi

      - name: Call Google Ratings API
        if: steps.ratings-time.outputs.should_run == 'true'
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET GitHub Secret이 비어 있습니다."
            exit 1
          fi

          echo "Updating Google ratings..."

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --location \
            --connect-timeout 30 \
            --max-time 900 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: KTownTriangle-GitHub-Actions/1.0" \
            "https://www.ktowntriangle.com/api/update-google-ratings"

          echo ""
          echo "Google ratings update completed."

      - name: Google Ratings skipped
        if: steps.ratings-time.outputs.should_run != 'true'
        shell: bash
        run: |
          echo "Google Ratings only runs once during the midnight hour."
          echo "Schedule: 12:07 AM Eastern Time."
