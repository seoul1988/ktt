name: KTown Triangle Auto Update

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: ktown-auto-update
  cancel-in-progress: true

jobs:
  community_news:
    name: Update Korea and US News
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Community News
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx --yes tsx scripts/sync-community-news.ts

  todays_korea:
    name: Update Celebrity News
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Today's Korea
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx --yes tsx scripts/update-todays-korea.ts

  google_ratings:
    name: Update Google Ratings
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Check schedule
        id: ratings_time
        shell: bash
        run: |
          EVENT_NAME="${{ github.event_name }}"
          ET_HOUR=$(TZ=America/New_York date +%-H)

          if [ "$EVENT_NAME" = "schedule" ] && [ "$ET_HOUR" = "0" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Call Google Ratings API
        if: steps.ratings_time.outputs.should_run == 'true'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl \
            --fail-with-body \
            --show-error \
            --location \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "https://www.ktowntriangle.com/api/update-google-ratings"

      - name: Google Ratings skipped
        if: steps.ratings_time.outputs.should_run != 'true'
        run: echo "Google Ratings was skipped."
