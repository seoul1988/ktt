name: KTown Triangle Auto Update

on:
  schedule:
    # 매시간 7분에 실행
    - cron: "7 * * * *"

  # GitHub Actions 화면에서 수동 실행
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================
  # 한국·미국 뉴스
  # 매시간 실행
  # =========================================================
  community-news:
    name: Update Korea and US News
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call Community News API
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET GitHub Secret이 비어 있습니다."
            exit 1
          fi

          echo "Updating Korea and US news..."

          curl \
            --fail-with-body \
            --show-error \
            --location \
            --connect-timeout 15 \
            --max-time 120 \
            --retry 1 \
            --retry-delay 5 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: KTownTriangle-GitHub-Actions/1.0" \
            "https://www.ktowntriangle.com/api/cron/sync-community-news"

          echo ""
          echo "Korea and US news update completed."

  # =========================================================
  # Today's Korea 연예인 뉴스
  # 매시간 실행
  # =========================================================
  todays-korea:
    name: Update Celebrity News
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call Today's Korea API
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET GitHub Secret이 비어 있습니다."
            exit 1
          fi

          echo "Updating celebrity news..."

          curl \
            --fail-with-body \
            --show-error \
            --location \
            --connect-timeout 15 \
            --max-time 120 \
            --retry 1 \
            --retry-delay 5 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: KTownTriangle-GitHub-Actions/1.0" \
            "https://www.ktowntriangle.com/api/todays-korea/update"

          echo ""
          echo "Celebrity update completed."

  # =========================================================
  # Google Ratings
  # 미국 동부시간 매일 밤 12시대 예약 실행에서만 실행
  # 수동 실행 시에는 실행하지 않음
  # =========================================================
  google-ratings:
    name: Update Google Ratings
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Check Google Ratings schedule
        id: ratings-time
        shell: bash
        run: |
          set -euo pipefail

          EVENT_NAME="${{ github.event_name }}"
          ET_DATE=$(TZ=America/New_York date +%Y-%m-%d)
          ET_HOUR=$(TZ=America/New_York date +%-H)
          ET_MINUTE=$(TZ=America/New_York date +%-M)

          echo "Event: ${EVENT_NAME}"
          echo "Eastern date: ${ET_DATE}"
          echo "Current Eastern Time: ${ET_HOUR}:${ET_MINUTE}"

          if [ "$EVENT_NAME" = "schedule" ] && [ "$ET_HOUR" = "0" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled midnight run: Google Ratings will run."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Google Ratings will be skipped."
          fi

      - name: Call Google Ratings API
        if: steps.ratings-time.outputs.should_run == 'true'
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET GitHub Secret이 비어 있습니다."
            exit 1
          fi

          echo "Updating Google ratings..."

          curl \
            --fail-with-body \
            --show-error \
            --location \
            --connect-timeout 20 \
            --max-time 300 \
            --retry 1 \
            --retry-delay 10 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: KTownTriangle-GitHub-Actions/1.0" \
            "https://www.ktowntriangle.com/api/update-google-ratings"

          echo ""
          echo "Google ratings update completed."

      - name: Google Ratings skipped
        if: steps.ratings-time.outputs.should_run != 'true'
        shell: bash
        run: |
          echo "Google Ratings was skipped."
          echo "It runs only during the scheduled 12:07 AM Eastern workflow."
          echo "Manual Run workflow does not update Google Ratings."
