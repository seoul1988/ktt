name: KTown Triangle Auto Update

on:
  schedule:
    # 매시간 정각 실행 후 미국 동부시간 기준으로 필요한 작업만 실행
    # 이 방식은 EST/EDT(서머타임)를 자동으로 처리합니다.
    - cron: "0 * * * *"

  # GitHub Actions 화면에서 수동 실행
  workflow_dispatch:

concurrency:
  group: ktown-triangle-auto-update
  cancel-in-progress: false

jobs:
  todays-korea:
    name: Update Celebrity News
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check celebrity update schedule
        id: celebrity-time
        shell: bash
        run: |
          ET_HOUR=$(TZ=America/New_York date +%-H)

          echo "hour=$ET_HOUR" >> "$GITHUB_OUTPUT"
          echo "Current Eastern Time hour: $ET_HOUR"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: Celebrity update will run."
          elif [ "$ET_HOUR" = "10" ] || \
               [ "$ET_HOUR" = "15" ] || \
               [ "$ET_HOUR" = "18" ] || \
               [ "$ET_HOUR" = "19" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled celebrity update will run."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Celebrity update will be skipped this hour."
          fi

      - name: Call Today's Korea API
        if: steps.celebrity-time.outputs.should_run == 'true'
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET GitHub Secret이 비어 있습니다."
            exit 1
          fi

          echo "Updating celebrity news..."

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --location \
            --connect-timeout 30 \
            --max-time 300 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: KTownTriangle-GitHub-Actions/1.0" \
            "https://www.ktowntriangle.com/api/todays-korea/update"

          echo ""
          echo "Celebrity update completed."

      - name: Celebrity update skipped
        if: steps.celebrity-time.outputs.should_run != 'true'
        shell: bash
        run: |
          echo "Celebrity updates run at Eastern Time:"
          echo "10:00 AM, 3:00 PM, 6:00 PM and 7:00 PM."

  google-ratings:
    name: Update Google Ratings
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check Google Ratings schedule
        id: ratings-time
        shell: bash
        run: |
          ET_HOUR=$(TZ=America/New_York date +%-H)

          echo "hour=$ET_HOUR" >> "$GITHUB_OUTPUT"
          echo "Current Eastern Time hour: $ET_HOUR"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: Google Ratings update will run."
          elif [ "$ET_HOUR" = "1" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled Google Ratings update will run."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Google Ratings update will be skipped this hour."
          fi

      - name: Call Google Ratings API
        if: steps.ratings-time.outputs.should_run == 'true'
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -e

          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET GitHub Secret이 비어 있습니다."
            exit 1
          fi

          echo "Updating Google ratings..."

          curl \
            --fail-with-body \
            --show-error \
            --silent \
            --location \
            --connect-timeout 30 \
            --max-time 900 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: KTownTriangle-GitHub-Actions/1.0" \
            "https://www.ktowntriangle.com/api/update-google-ratings"

          echo ""
          echo "Google ratings update completed."

      - name: Google Ratings skipped
        if: steps.ratings-time.outputs.should_run != 'true'
        shell: bash
        run: |
          echo "Google Ratings runs once daily at 1:00 AM Eastern Time."

  # Instagram 자동 수집은 현재 중지했습니다.
  # 다시 사용할 때 instagram job을 복구하면 됩니다.
ould_run != 'true'
        shell: bash
        run: |
          echo "Google Ratings runs automatically only at UTC 0 and 12."
          echo "Manual workflow runs always execute Google Ratings."
