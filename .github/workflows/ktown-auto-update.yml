name: KTown Triangle Auto Update

on:
  schedule:
    # 매시간 7분에 실행
    - cron: "7 * * * *"

  # GitHub Actions 화면에서 수동 실행
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================
  # RSS 한국·미국 뉴스
  # 매 1시간
  # =========================================================
  community-news:
    name: Update Korea and US News
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call Community News API
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET GitHub Secret이 비어 있습니다."
            exit 1
          fi

          echo "Updating Korea and US news..."

          curl \
            --fail-with-body \
            --show-error \
            --location \
            --connect-timeout 15 \
            --max-time 120 \
            --retry 1 \
            --retry-delay 5 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: KTownTriangle-GitHub-Actions/1.0" \
            "https://www.ktowntriangle.com/api/cron/sync-community-news"

          echo ""
          echo "Korea and US news update completed."

  # =========================================================
  # Today's Korea
  # 매 1시간
  # =========================================================
  todays-korea:
    name: Update Celebrity News
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Call Today's Korea API
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET GitHub Secret이 비어 있습니다."
            exit 1
          fi

          echo "Updating Today's Korea..."

          curl \
            --fail-with-body \
            --show-error \
            --location \
            --connect-timeout 15 \
            --max-time 120 \
            --retry 1 \
            --retry-delay 5 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: KTownTriangle-GitHub-Actions/1.0" \
            "https://www.ktowntriangle.com/api/todays-korea/update"

          echo ""
          echo "Today's Korea update completed."

  # =========================================================
  # Google Ratings
  # 매일 미국 동부시간 12:00 AM 시간대에 1번
  # 현재 전체 Workflow가 :07에 실행되므로 실제 실행은 약 12:07 AM ET
  # 수동 실행에서는 실행하지 않음
  # =========================================================
  google-ratings:
    name: Update Google Ratings
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: Check Google Ratings schedule
        id: ratings-time
        shell: bash
        run: |
          set -euo pipefail

          EVENT_NAME="${{ github.event_name }}"
          ET_HOUR=$(TZ=America/New_York date +%-H)

          echo "Event: ${EVENT_NAME}"
          echo "Eastern hour: ${ET_HOUR}"

          if [ "$EVENT_NAME" = "schedule" ] && [ "$ET_HOUR" = "0" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Google Ratings will run."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Google Ratings will be skipped."
          fi

      - name: Call Google Ratings API
        if: steps.ratings-time.outputs.should_run == 'true'
        shell: bash
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::CRON_SECRET GitHub Secret이 비어 있습니다."
            exit 1
          fi

          echo "Updating Google ratings..."

          curl \
            --fail-with-body \
            --show-error \
            --location \
            --connect-timeout 20 \
            --max-time 300 \
            --retry 1 \
            --retry-delay 10 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H "User-Agent: KTownTriangle-GitHub-Actions/1.0" \
            "https://www.ktowntriangle.com/api/update-google-ratings"

          echo ""
          echo "Google ratings update completed."

      - name: Google Ratings skipped
        if: steps.ratings-time.outputs.should_run != 'true'
        shell: bash
        run: |
          echo "Google Ratings was skipped."
          echo "Automatic update runs once daily around 12:07 AM Eastern Time."
          echo "Manual workflow runs do not update Google Ratings."
