name: KTown Triangle Auto Update

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: ktown-auto-update
  cancel-in-progress: true

jobs:
  community_news:
    name: Update Korea and US News
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Community News
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx --yes tsx scripts/sync-community-news.ts

  todays_korea:
    name: Update Celebrity News
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Today's Korea
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx --yes tsx scripts/update-todays-korea.ts

  google_ratings:
    name: Update Google Ratings
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check Google Ratings schedule
        id: ratings_time
        shell: bash
        run: |
          EVENT_NAME="${{ github.event_name }}"
          ET_HOUR=$(TZ=America/New_York date +%-H)

          echo "Event: ${EVENT_NAME}"
          echo "Eastern hour: ${ET_HOUR}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual test: Google Ratings will run."
          elif [ "$EVENT_NAME" = "schedule" ] && [ "$ET_HOUR" = "0" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled Google Ratings update will run."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Google Ratings will be skipped."
          fi

      - name: Checkout repository
        if: steps.ratings_time.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.ratings_time.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        if: steps.ratings_time.outputs.should_run == 'true'
        run: npm install --no-audit --no-fund

      - name: Run Google Ratings
        if: steps.ratings_time.outputs.should_run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: npx --yes tsx scripts/update-google-ratings.ts

      - name: Google Ratings skipped
        if: steps.ratings_time.outputs.should_run != 'true'
        run: echo "Google Ratings was skipped."
