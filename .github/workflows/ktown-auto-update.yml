name: KTown Triangle Auto Update

on:
  schedule:
    # 기존 커뮤니티/연예 뉴스: 매시간 7분
    - cron: "7 * * * *"

    # 주식 중요 속보: 10분마다
    - cron: "*/10 * * * *"

  workflow_dispatch:

concurrency:
  group: ktown-auto-update
  cancel-in-progress: true

jobs:
  community_news:
    name: Update Korea and US News
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Community News
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx --yes tsx scripts/sync-community-news.ts

  todays_korea:
    name: Update Celebrity News
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run Today's Korea
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx --yes tsx scripts/update-todays-korea.ts

  stock_news:
    name: Update Important Stock Market News
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/10 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements-stock-news.txt

      - name: Install Stock News dependencies
        run: pip install -r scripts/requirements-stock-news.txt

      - name: Run Stock News
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MIN_IMPORTANCE: "3"
          MAX_ARTICLE_AGE_HOURS: "24"
          PER_FEED_LIMIT: "40"
          RETENTION_HOURS: "24"
        run: python scripts/fetch_stock_news.py

  google_ratings:
    name: Update Google Ratings
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '7 * * * *'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check Google Ratings schedule
        id: ratings_time
        shell: bash
        run: |
          EVENT_NAME="${{ github.event_name }}"
          ET_HOUR=$(TZ=America/New_York date +%-H)

          echo "Event: ${EVENT_NAME}"
          echo "Eastern hour: ${ET_HOUR}"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Manual test: Google Ratings will run."
          elif [ "$EVENT_NAME" = "schedule" ] && [ "$ET_HOUR" = "0" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            echo "Scheduled Google Ratings update will run."
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Google Ratings will be skipped."
          fi

      - name: Checkout repository
        if: steps.ratings_time.outputs.should_run == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.ratings_time.outputs.should_run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        if: steps.ratings_time.outputs.should_run == 'true'
        run: npm install --no-audit --no-fund

      - name: Run Google Ratings
        if: steps.ratings_time.outputs.should_run == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.GOOGLE_PLACES_API_KEY }}
        run: npx --yes tsx scripts/update-google-ratings.ts

      - name: Google Ratings skipped
        if: steps.ratings_time.outputs.should_run != 'true'
        run: echo "Google Ratings was skipped."
